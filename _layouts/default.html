<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
</head>
<body>
  <header>
    <div class="wrapper" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
      <div style="flex: 1; min-width: 250px;">
        <h1 style="margin: 0 0 10px 0;"><a href="{{ '/' | relative_url }}" style="text-decoration: none;">{{ site.title }}</a></h1>
        <p style="margin: 0;">{{ site.description }}</p>
      </div>
      <div style="text-align: right;">
        <a href="https://bit.ly/46Bv4hv" style="display: inline-block; padding: 10px 20px; background: linear-gradient(135deg, #ff6b6b, #f26522); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 0.9em; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(255, 107, 107, 0.2);">🔗 Share Site</a>
      </div>
    </div>
  </header>

  <main>
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer>
    <div class="wrapper" style="text-align: center;">
      <div style="margin-bottom: 20px;">
        <p style="color: var(--text-secondary); margin: 0 0 15px 0;">
          <strong>Quick Share:</strong> <a href="https://bit.ly/46Bv4hv" style="color: var(--accent-primary); font-weight: 600;">https://bit.ly/46Bv4hv</a>
        </p>
        <div style="display: flex; gap: 10px; justify-content: center;">
          <a href="https://bit.ly/46Bv4hv" style="display: inline-block; padding: 8px 16px; background: rgba(255, 107, 107, 0.1); border: 1px solid rgba(255, 107, 107, 0.3); color: #ff6b6b; text-decoration: none; border-radius: 6px; font-size: 0.85em; font-weight: 600; transition: all 0.3s ease;" onmouseover="this.style.background='rgba(255, 107, 107, 0.2)'; this.style.transform='translateY(-2px)';" onmouseout="this.style.background='rgba(255, 107, 107, 0.1)'; this.style.transform='translateY(0)';">📤 Copy & Share</a>
        </div>
      </div>
      <p style="color: var(--text-tertiary); margin: 0; padding-top: 20px; border-top: 1px solid var(--border-color);">&copy; 2026 {{ site.title }}. Built with GitHub Pages and Jekyll.</p>
    </div>
  </footer>
</body>
</html>
