<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
</head>
<body>
  <header>
    <div class="wrapper">
      <h1><a href="{{ '/' | relative_url }}" style="text-decoration: none; color: inherit;">{{ site.title }}</a></h1>
      <p>{{ site.description }}</p>
    </div>
  </header>

  <main>
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer>
    <div class="wrapper" style="text-align: center; color: var(--text-secondary); padding: 20px 0; border-top: 1px solid var(--border-color); margin-top: 40px;">
      <p>&copy; 2026 {{ site.title }}. Built with GitHub Pages and Jekyll.</p>
    </div>
  </footer>
</body>
</html>
